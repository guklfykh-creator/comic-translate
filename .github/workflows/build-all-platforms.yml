name: Build All Platforms

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: x86_64
            python-version: '3.14.5'
          - runner: macos-14
            arch: arm64
            python-version: '3.14.5'
          - runner: macos-15
            arch: arm64
            python-version: '3.14.5'
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build app with PyInstaller
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: pyinstaller ct-mac.spec

      - name: Build DMG
        run: |
          chmod +x builddmg.sh
          ./builddmg.sh

      - name: Rename DMG with arch
        run: mv "dist/Comic Translate.dmg" "dist/Comic-Translate-macOS-${{ matrix.arch }}.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v6
        with:
          name: Comic-Translate-macOS-${{ matrix.arch }}
          path: dist/Comic-Translate-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 1

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: win2022
          - runner: windows-2025
            label: win2025
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.5'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller ct-win.spec

      - name: Create ZIP archive
        shell: pwsh
        run: |
          cd dist
          Compress-Archive -Path "Comic Translate" -DestinationPath "Comic-Translate-Windows-${{ matrix.label }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: Comic-Translate-Windows-${{ matrix.label }}
          path: dist/Comic-Translate-Windows-${{ matrix.label }}.zip
          if-no-files-found: error
          retention-days: 1

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            label: ubuntu-22.04
          - runner: ubuntu-24.04
            label: ubuntu-24.04
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglib2.0-0 \
            libxkbcommon0 \
            libdbus-1-3 \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxrandr2 \
            libxss1 \
            libasound2 \
            libdrm2 \
            libegl1 \
            libfontconfig1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.5'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller ct-linux.spec

      - name: Build tarball
        run: |
          chmod +x buildlinux.sh
          ./buildlinux.sh
          mv "dist/Comic-Translate-linux-x86_64.tar.gz" "dist/Comic-Translate-Linux-${{ matrix.label }}.tar.gz"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v6
        with:
          name: Comic-Translate-Linux-${{ matrix.label }}
          path: dist/Comic-Translate-Linux-${{ matrix.label }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  create-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('app/version.py').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts
          merge-multiple: false

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find release-artifacts -type f \( \
            -name '*.dmg' -o \
            -name '*.zip' -o \
            -name '*.tar.gz' \
          \) -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Comic Translate v${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: release-files/*
